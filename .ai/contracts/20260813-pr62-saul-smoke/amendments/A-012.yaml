- finding_id: CTO-030
  field: saul_review_workflow
  action: narrow
  note: "Remove the Hostinger invocation path from saul-review.yml. Preferred: delete .github/workflows/saul-review.yml entirely, OR convert it so it has neither runs-on: self-hosted nor any trigger that can acquire the persistent Saul runner (pull_request/workflow_dispatch + self-hosted). A-011 skip-guard TRANSITIONAL_RETIRED_TRUSTED_ON_MAIN is insufficient: it lives in the same candidate-controlled workflow; a future collaborator PR can delete or bypass it, add an earlier run step, and execute arbitrary code before any trusted-tree check. This is the CTO-021 persistent-runner trust boundary, not DEFERRED_NONBLOCKING. Keep/harden .github/workflows/saul-cto-review.default-branch.yml as the only self-hosted Saul workflow: pull_request_target (executable from default branch after merge) + workflow_dispatch with a job-level if: evaluated before runner assignment so a feature-branch dispatch does not acquire Hostinger. pull_request_target from same-repo PRs remains allowed. Do not add on: pull_request to the trusted file (that would make HEAD YAML the executable workflow). Candidate remains DATA (path: candidate-data, persist-credentials false, never execute candidate scripts). No allow-unsafe-pr-checkout. No candidate-HEAD trust. Retarget tests that currently parse saul-review.yml (sai_auth_saul_test.py WORKFLOW, sai_auth_test.py ~399, sai_auth_workflow_trust.py CANDIDATE_WF) at the trusted default-branch file and/or assert saul-review.yml is absent or cannot acquire self-hosted. Do not grow sai_auth_review.py (500) or sai_auth_test.py (~497); only tiny path edits or move fixtures to sai_auth_saul_test.py / sai_auth_workflow_trust_test.py. Contractor updates .ai/_config/authorization.yaml workflow pointer if it still names saul-review.yml. Update threat-trace + merge-readiness: merge-activated state = trusted file on main + no candidate self-hosted saul-review.yml; residual new-file self-hosted workflows = runner-group UNKNOWN/VERIFY_REQUIRED DEFERRED_NONBLOCKING (cannot inspect; 403). Preserve this-PR review continuity through a mechanism whose executable workflow is independently trusted. Last qualifying Saul is 31771910025 on 4503f55; after removing the candidate self-hosted pull_request workflow this Cloud gh cannot workflow_dispatch (actions=read / 403). The merge-activated trusted pull_request_target is the post-merge review path. Do not fake origin/main. Do not leave Dezocode a required dispatch chore as the only path. authority_expanding false."
