    label: Current origin/main gap
    attacker_input: "Deleted candidate .github/workflows/saul-review.yml (was pull_request + self-hosted)"
    trust_crossing: "GitHub loads pull_request_target from the default branch only. origin/main has no saul-cto-review.default-branch.yml, so pull_request_target is not live yet."
    privilege: "self-hosted runner claimed by any matching workflow; GITHUB_TOKEN of the repo"
    execution_path: "This SHA deletes candidate saul-review.yml so Hostinger is not acquired from candidate pull_request. Continuity is last qualifying Saul 31771910025 on 4503f55. This Cloud gh cannot workflow_dispatch (actions=read / 403)."
