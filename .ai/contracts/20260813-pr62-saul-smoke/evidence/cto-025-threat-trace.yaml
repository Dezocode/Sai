    execution_path: "checkout PR head into GITHUB_WORKSPACE CWD, then python3 scripts/ or ./scripts/invoke-saul-review from that CWD"
    damage: "arbitrary code on the authenticated Saul runner; secret theft; forged APPROVE"
    why_forbidden: "Split-path design keeps executable tree on runner-image or default-branch checkout; candidate is DATA at path: candidate-data with persist-credentials: false. Trusted run: must not contain $SAI_CANDIDATE_TREE/scripts/, candidate-data/scripts/, ./scripts/invoke-saul-review, or python3 scripts/. Fail closed TRUSTED_REVIEWER_UNAVAILABLE. Same-repo only. No allow-unsafe-pr-checkout."
  - id: origin-main-gap
    label: Current origin/main gap
    attacker_input: "Candidate .github/workflows/saul-review.yml on this PR (historically on: pull_request)"
    trust_crossing: "GitHub loads pull_request workflows from the head SHA. origin/main has no saul-cto-review.default-branch.yml, so pull_request_target is not live."
    privilege: "self-hosted runner claimed by any matching workflow; GITHUB_TOKEN of the repo"
    execution_path: "Until this SHA, Hostinger auto-ran candidate saul-review.yml on pull_request"
    damage: "candidate-defined run steps on the persistent authenticated runner (CTO-021)"
    current_mitigation: "This SHA retires on: pull_request from saul-review.yml. Remaining THIS-PR reviews use collaborator-gated workflow_dispatch. Trusted file is still not on origin/main until human merge."
  - id: post-merge-intended
    label: Post-merge intended state
    attacker_input: "Future PRs against main"
    trust_crossing: "GitHub loads pull_request_target from protected main only"
    privilege: "base-repo token + self-hosted runner, constrained by same-repo if: and DATA-only candidate checkout"
    execution_path: "trusted workflow from main; candidate SHA fetched to candidate-data; invoke scripts from runner-image or trusted-default-branch"
    damage_if_intact: "candidate cannot change executed commands by mutating saul-review.yml"
    post_merge_expected: "saul-cto-review.default-branch.yml exists on origin/main with pull_request_target; saul-review.yml on main has no pull_request trigger"
  - id: residual-dispatch-or-new-pr-workflow
    label: Residual collaborator dispatch / future new PR workflow
    attacker_input: "Collaborator workflow_dispatch of candidate YAML, or a future PR adding a NEW self-hosted pull_request workflow"
    trust_crossing: "Dispatch YAML comes from the dispatched ref; a new workflow file on a later PR could auto-run on Hostinger if pull_request is reintroduced"
    privilege: "write collaborators already have repo write; runner-group restriction is UNKNOWN/VERIFY_REQUIRED"
    execution_path: "gh workflow run saul-review.yml --ref <branch>; or a new .github/workflows/*.yml with on: pull_request runs-on: self-hosted"
    damage: "collaborator-level (not anonymous fork) code on the Saul runner; or a future PR re-opening CTO-021"
    classification: DEFERRED_NONBLOCKING
    state: UNKNOWN/VERIFY_REQUIRED
    reason: "Runner-group restriction is uninspected. Residual is not a reason to require an intermediate bootstrap PR. Human merge of PR #62 is the activation event for the reviewed trusted file."
