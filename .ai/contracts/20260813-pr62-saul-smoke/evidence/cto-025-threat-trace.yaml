    label: Post-merge intended state
    attacker_input: "Future PRs against main"
    trust_crossing: "GitHub loads pull_request_target from protected main only"
    privilege: "base-repo token + self-hosted runner, constrained by same-repo if: and DATA-only candidate checkout"
    execution_path: "trusted workflow from main; candidate SHA fetched to candidate-data; invoke scripts from runner-image or trusted-default-branch; dispatch only from default-branch refs"
