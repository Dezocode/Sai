    why_forbidden: "Split-path design keeps executable tree on runner-image or default-branch checkout; candidate is DATA at path: candidate-data with persist-credentials: false. Trusted run: must not contain $SAI_CANDIDATE_TREE/scripts/, candidate-data/scripts/, ./scripts/invoke-saul-review, or python3 scripts/. Fail closed TRUSTED_REVIEWER_UNAVAILABLE. Same-repo only. No allow-unsafe-pr-checkout."
