# Saul quality checks included from code-health.yaml (Decision 0005).
# REQ-5300146420 / B-SAUL-QUALITY-LOOP-001. Active only with command+fixtures.
# Controller (not a health-detector): scripts/saul-review-controller
saul_quality_learning:
  finding_to_ci: ".ai/shared/quality/saul/FINDING_TO_CI.md"
  controller: "scripts/saul-review-controller"

checks:
  - id: saul-sha-shard-quality
    class: health-detector
    status: active
    command: "scripts/verify-saul-shard-quality --self-test"
    self_test: synthetic
    fixtures:
      - shard-manifest-complete-good
      - shard-missing-unit-bad
      - shard-duplicate-covering-omission-bad
      - shard-wrong-content-digest-bad
      - shard-stale-head-bad
      - shard-wrong-base-digest-bad
      - shard-synthetic-bad
      - shard-codex-not-invoked-bad
      - shard-binary-omitted-bad
      - shard-rename-delete-omitted-bad
      - shard-scratch-removed-good
    note: "Exact base/head SHA-bound shard coverage. Sister detector."

  - id: saul-architecture-quality
    class: health-detector
    status: active
    command: "scripts/verify-saul-architecture-quality --self-test"
    self_test: synthetic
    fixtures:
      - arch-local-impact-good
      - arch-system-missing-bad
      - arch-shards-missing-bad
      - arch-domain-stale-bad
      - arch-fail-creates-blocker-good
      - arch-system-required-now-good
    note: "LOCAL_ARCH + IMPACT_ARCH each trigger; SYSTEM_ARCH before convergence."

  - id: saul-authenticity-proof
    class: health-detector
    status: active
    command: "scripts/verify-saul-authenticity --self-test"
    self_test: synthetic
    fixtures:
      - exact-state-v2-fixture-good
      - cursor-fake-saul-bad
      - fake-github-check-bad
      - candidate-key-substitution-bad
      - wrong-public-key-bad
      - tampered-shard-digest-bad
      - tampered-architecture-digest-bad
      - historical-v1-not-merge-viable-bad
      - unsigned-bad
      - synthetic-review-bad
      - codex-not-invoked-bad
      - wrong-head-bad
      - wrong-base-bad
      - stale-review-bad
    note: "Ed25519 exact-state v2. Check name is not clearance."

  - id: saul-finding-regression-guard
    class: health-detector
    status: active
    command: "scripts/verify-saul-finding-regression-guards --self-test"
    self_test: synthetic
    fixtures:
      - finding-deterministic-linked-good
      - finding-heuristic-linked-good
      - finding-semantic-rationale-good
      - finding-missing-guard-bad
      - finding-semantic-silent-bad
      - finding-unlinked-check-bad
      - finding-unknown-check-id-bad
      - finding-recurring-creates-guard-good
      - finding-recurring-unlinked-bad
      - finding-defect-present-bad
      - finding-clean-good
    note: "FINDING_TO_CI: blocking finding -> DETERMINISTIC|HEURISTIC|SEMANTIC."

  - id: saul-gated-ci
    class: health-detector
    status: active
    command: "scripts/verify-saul-gated-ci --self-test"
    self_test: synthetic
    fixtures:
      - gated-absent-proof-nonsuccess-good
      - gated-false-terminal-bad
      - gated-missing-ledger-blocker-bad
      - gated-substitute-evidence-bad
      - gated-synthetic-review-bad
      - gated-unsigned-exact-head-bad
      - gated-missing-check-gate-bad
    note: "Ordinary CI consumes v2; cannot mint PASS. Absent proof exits 0."

  - id: saul-quality-reference
    class: health-detector
    status: active
    command: "scripts/verify-saul-quality-reference --self-test"
    self_test: synthetic
    fixtures:
      - qref-mapping-complete-good
      - qref-missing-mapping-bad
      - qref-rust-universal-bad
      - qref-parallel-subsystem-bad
      - qref-go-swift-not-applicable-good
    note: "Domain mapping. rust is control-plane only. No *-quality subsystems."

  - id: saul-anti-balloon
    class: health-detector
    status: active
    command: "scripts/verify-saul-anti-balloon --self-test"
    self_test: synthetic
    fixtures:
      - antiballoon-clean-good
      - antiballoon-dup-guard-bad
      - antiballoon-per-blocker-workflow-bad
      - antiballoon-unexecuted-guard-bad
      - antiballoon-threshold-raised-bad
      - antiballoon-ready-truth-bad
      - antiballoon-orphan-schema-bad
    note: "Decision-0005 anti-balloon. Not a second framework."

  - id: saul-ralph-resume
    class: health-detector
    status: active
    command: "scripts/sai-resume --self-test"
    self_test: synthetic
    fixtures:
      - ralph-liveness-a-wave-complete-good
      - ralph-liveness-b-restart-reassess-good
      - ralph-liveness-c-saul-pending-continue-good
      - ralph-liveness-d-external-frontier-good
      - ralph-liveness-e-saul-pass-sai-pending-good
      - ralph-liveness-f-sai-pass-blocker-remains-good
      - ralph-liveness-g-predicates-ready-good
      - ralph-liveness-h-physical-wait-reassess-good
      - ralph-liveness-i-empty-todo-blockers-good
      - ralph-liveness-j-saul-pending-external-good
      - ralph-liveness-k-saul-fail-continue-good
      - ralph-liveness-l-sai-fail-nonterminal-good
      - ralph-reject-false-terminal-bad
      - ralph-reject-blocker-terminal-bad
      - ralph-reject-missing-ledger-bad
      - ralph-reject-missing-check-gate-bad
      - ralph-enforce-skip-reassess-bad
    note: "Persistent Primary A-L. Empty todo is not exit. Physical WAITING_EXTERNAL reassesses. Do not PASS."

