# SAI agent authorization policy — decision 0006 / comment 5282088737
version: 1
decision: "0006"
owner: "Sai (CEO) + Cora (contract admin); Saul reviews as Codex CTO"

enforcement:
  mode: fail-closed
  # Commits whose trees lack this file predate the control plane.
  skip_commits_missing_policy: true
  # Human Decision 0007 stack on this PR landed without agent trailers.
  # Preserve those commits; require identity on descendants of this SHA.
  skip_commits_missing_identity_at_or_before: "d113fa0bf75b43491c25723f57cf9dec1e6196de"
  # Optional SHA-pinned window for stacked PRs whose first contractor
  # commits predate Cora lease issuance. Unset here (PR #62 has none).
  skip_commits_missing_contract_at_or_before: ""
  session_file: ".git/sai-session.json"
  trust_session: false

audit:
  # Grammar-only. Does not skip verify-agent-authorization.
  # Human Decision 0007 commit used Task-ID without HHMM; history is
  # preserved (no force-push / no authorization weakening).
  preserve_malformed_task_id:
    - sha: "d14402e625aad54a5dff5d0f00785291d83c414a"
      original_task_id: "20260813-runtime-intelligence-plane"
      reason: "human Decision 0007 docs commit; grammar exception only"
  # CTO-028/029: SHA-bound pins are not loaded from this contractor-writable file.
  # Source is git show HEAD:.ai/authorizations/sha-bound-authorization.yaml
  # proven at introduced_by_sha (officer commit-time grant, not HEAD grant).
  # Ignore sha_bound_authorization if present.

activation:
  mode: lazy-first-write
  session_start_init: false
  register_primary_runtime_at: first_repository_mutation_gate
  compact_orchestrator: true
  durable_truth: git
  note: >
    Cursor sessions may read/inspect/plan freely. The write gate activates
    on the first attempted repository mutation (pre-commit). Unknown
    identity emits SAI_IDENTITY_REQUIRED with SAI_CUE CORA_ADMISSION or
    RESUME_CONTRACTOR (a router, not merely a wall). Primary runtime
    identity is registered only then. No manual per-session control-plane
    setup. Heavy work belongs in subagents; Saul runs on the self-hosted
    Codex runner; Cora is contract admin; Sai is governance.

bootstrap:
  enabled: true
  standing: false
  bound_pr: 62
  disable_after_human_review: true
  reuse_policy: listed-task-ids-only
  task_ids:
    - "20260813-1517-auth-loop-cursor-cloud"
    - "20260813-1752-saul-runner-cursor-cloud"
  task_bindings:
    "20260813-1517-auth-loop-cursor-cloud":
      until_sha: "d113fa0bf75b43491c25723f57cf9dec1e6196de"
    "20260813-1752-saul-runner-cursor-cloud":
      until_sha: "d113fa0bf75b43491c25723f57cf9dec1e6196de"
  agent_trailers:
    - cursor-cloud
    - cursor-cloud-vm
  allowed_path_prefixes:
    - ".ai/"
    - "scripts/"
    - ".githooks/"
    - ".github/"
    - "tests/"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "CODEX.md"
    - "README.md"
    - ".gitignore"
    - "OPENCLAW.md"
  note: >
    One-time landing of this control plane by an unbound Cursor Cloud
    runtime. Closed at until_sha (inclusive). New commits cannot reuse
    bootstrap; they need a tracked officer grant or a Cora lease.

officer_grants:
  required: true
  required_after_sha: "d113fa0bf75b43491c25723f57cf9dec1e6196de"
  dir: ".ai/authorizations/grants"
  note: >
    Agent trailers are provenance, not authority. Officer writes after
    required_after_sha need a tracked grant bound to task, principal,
    and paths.

runtimes:
  cursor_implementation:
    - cursor-cloud-vm
    - cursor-desktop
  saul_required: codex-desktop
  sai_primary: cursor-cloud-vm
  cora_primary: cursor-cloud-vm

officers:
  ceo:
    name: Sai
    assume_runtimes: [cursor-cloud-vm, cursor-desktop]
    write_class: governance
    may_record_sai_verification: true
  ctr-admin:
    name: Cora
    assume_runtimes: [cursor-cloud-vm, cursor-desktop]
    write_class: contract-admin
    may_implement_product: false
  dezo-sec-codex1:
    name: Saul
    assume_runtimes: [codex-desktop]
    write_class: cto
    cursor_impersonation: forbidden
  mimi:
    name: Mimi
    assume_runtimes: [claude-code-cli]
    write_class: portfolio

path_classes:
  contract-admin:
    - ".ai/contracts/**"
    - ".ai/requests/**"
    - ".ai/agents/**"
    - ".ai/runs/**"
    - ".ai/contracts/_templates/**"
  governance:
    - ".ai/**"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "CODEX.md"
    - ".cursor/**"
  cto:
    - ".ai/agents/saul/**"
    - ".ai/shared/memory/**"
    - ".ai/_config/code-health.yaml"
    - ".ai/shared/references/code-health.md"
  portfolio:
    - ".ai/agents/mimi/**"
    - ".ai/runs/**"

protected_denied_for_contractors:
  - ".ai/agents/saul/**"
  - ".ai/shared/memory/decisions/**"
  - ".ai/agents/registry.json"
  - ".ai/agents/registry.schema.json"
  - ".ai/authorizations/**"

contractor:
  require_contract: true
  require_cora_lease: true
  execution_modes: [provisional, authorized]
  default_denied_paths:
    - ".ai/agents/saul/**"
    - ".ai/shared/memory/decisions/**"

authority_expanding_actions:
  - expand
  - grant-capability
  - remove-denied-path
  - change-repository
  - change-runtime
  - elevate-role

stale:
  new_revision_invalidates: [leases, saul_contract_approval, sai_contract_approval]
  new_implementation_sha_invalidates: [saul_implementation_approval, sai_implementation_approval]

human_gate:
  require:
    - cora_admin_complete
    - saul_approve_exact_revision
    - saul_approve_exact_sha
    - sai_approve_exact_revision
    - sai_approve_exact_sha
    - ci_green_exact_sha
    - contractor_fulfillment_evidence
    - no_stale_approvals
    - no_request_changes
    - no_authority_expansion_pending
    - saul_runtime_codex
    - saul_not_synthetic

codex:
  execution_host: dedicated-self-hosted-github-actions-runner
  proven_runner_name: hostinger-saul-codex
  proven_github_run_id: "31728732258"
  workflow: ".github/workflows/saul-review.yml"
  runs_on: [self-hosted]
  authentication: runner-local-codex-cli
  github_api_keys_required: false
  github_api_keys_optional_fallback:
    - OPENAI_API_KEY
    - CODEX_API_KEY
  missing_disposition: BLOCKED
  missing_reason: CODEX_UNAVAILABLE
  never_approve_without_codex: true
  never_approve_synthetic: true

idempotency:
  key_fields: [contract_id, contract_revision, implementation_head, reviewer, review_type]
  skip_if_unchanged_request_changes: true
  workflow_must_not_amend: true

queue:
  dir: ".ai/contracts/<id>/queue"
  claim_marker: "<!-- sai-transition:KEY -->"
  duplicate_eval_is_noop: true
  sai_must_not_reread_on_noop: true
  metrics:
    - sai_runs_per_material_transition
    - duplicate_sai_noop_rate
    - time_REQUEST_CHANGES_to_owner_claim
    - time_owner_claim_to_new_SHA
