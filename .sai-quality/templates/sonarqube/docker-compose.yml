services:
  db:
    image: ${POSTGRES_IMAGE:?pin exact postgres image digest in generated .env}
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set outside git}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
  sonarqube:
    image: ${SONARQUBE_IMAGE:?pin exact SonarQube image digest in generated .env}
    depends_on: [db]
    ports: ["9000:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set outside git}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
volumes:
  sonar_db: {}
  sonarqube_data: {}
  sonarqube_logs: {}
  sonarqube_extensions: {}
