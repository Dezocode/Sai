name: sai-quality-nightly
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 scripts/qualityctl.py verify --mode deep --through G03 --no-state-write
      - run: python3 scripts/health_report.py current
