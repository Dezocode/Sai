name: ralph
on: {pull_request: {}, workflow_dispatch: {}, check_run: {types: [completed]}}
permissions: {contents: read, checks: write}
jobs:
  continue:
    if: github.event_name != 'check_run' || github.event.check_run.name != 'Ralph / Program State'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha || github.sha }}
    - uses: actions/setup-go@v5
      with: {go-version: "1.22"}
    - run: go run ./ralph reconcile --once || test $? -eq 1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
