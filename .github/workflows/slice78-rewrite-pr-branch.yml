name: slice78-rewrite-pr-branch

on:
  push:
    branches:
      - foundry/lifecycle-dependency-graph-rewrite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  force-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force-update PR branch to clean slice-78 commit
        env:
          CLEAN_SHA: d1d5d103dfc267f58087fdbcc1be8617cff296ee
        run: |
          set -euo pipefail
          git push origin "${CLEAN_SHA}:refs/heads/foundry/lifecycle-dependency-graph" --force-with-lease
