name: saul-cto-review

# GitHub event bus → dedicated self-hosted Saul runner → local Codex CLI.
# Empty GitHub API secrets are not a prerequisite. Missing local `codex`
# or a failed `codex exec` => BLOCKED, never APPROVE.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      contract_id:
        description: Contract ID
        required: false
      revision:
        description: Contract revision (vN)
        required: false
      sha:
        description: Implementation SHA
        required: false
      review_type:
        description: contract or implementation
        default: implementation
      force:
        description: Bypass idempotent skip
        type: boolean
        default: false

concurrency:
  group: saul-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  invoke-saul:
    # Proven 2026-08-13 run 31728732258: runner_name=hostinger-saul-codex,
    # runner_group=Default, labels used=[self-hosted], Linux/X64,
    # hostname=c775b2b0df55, /.dockerenv present, docker CLI absent,
    # codex-cli 0.147.0 at /usr/bin/codex, ~/.codex present.
    # Jobs API did not return extra custom labels; do not guess saul-codex.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 45
    steps:
      - name: Record runner identity
        run: |
          echo "runner.name=${{ runner.name }}"
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          echo "RUNNER_NAME=${RUNNER_NAME:-}"
          echo "RUNNER_OS=${RUNNER_OS:-}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-}"
          echo "hostname=$(hostname 2>/dev/null || true)"
          if command -v docker >/dev/null 2>&1; then echo "docker=present"; else echo "docker=absent"; fi
          if [ -f /.dockerenv ]; then echo "containerized=dockerenv"; fi
          if command -v codex >/dev/null 2>&1; then
            echo "codex_bin=$(command -v codex)"
            codex --version 2>/dev/null || echo "codex_version=unreported"
          else
            echo "codex_bin=missing"
          fi
          if [ -n "${HOME:-}" ] && [ -d "$HOME/.codex" ]; then
            echo "codex_home_present=true"
          else
            echo "codex_home_present=false"
          fi

      # Candidate PR is DATA (CTO-012). Trusted reviewer comes from the
      # runner image, PR base SHA, or default-branch SHA. Never populate
      # the trusted tree from the candidate ref. If none exist: BLOCK.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize trusted reviewer tree
        id: trust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          TRUSTED="${GITHUB_WORKSPACE}/trusted-reviewer"
          mkdir -p "$TRUSTED" /tmp/saul
          TRUST_MODE=unavailable

          archive_trusted() {
            local sha="$1"
            git archive "$sha" scripts .ai/agents/saul CODEX.md \
              .ai/_config/authorization.yaml \
              .ai/shared/memory/decisions/0006-agent-authorization-loop.md \
              .ai/shared/schemas/contract-review.schema.json \
              | tar -x -C "$TRUSTED"
          }

          if [ -n "${SAI_TRUSTED_REVIEWER_ROOT:-}" ] && [ -x "${SAI_TRUSTED_REVIEWER_ROOT}/scripts/invoke-saul-review" ]; then
            cp -a "${SAI_TRUSTED_REVIEWER_ROOT}/." "$TRUSTED/"
            TRUST_MODE=runner-image
          elif [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}:scripts/invoke-saul-review" 2>/dev/null; then
            archive_trusted "$BASE_SHA"
            TRUST_MODE=base-ref
          else
            DEFAULT_SHA=""
            for ref in "origin/${DEFAULT_BRANCH}" "origin/main"; do
              if git rev-parse --verify "$ref" >/dev/null 2>&1; then
                cand=$(git rev-parse "$ref")
                if git cat-file -e "${cand}:scripts/invoke-saul-review" 2>/dev/null; then
                  DEFAULT_SHA=$cand
                  break
                fi
              fi
            done
            if [ -n "$DEFAULT_SHA" ]; then
              archive_trusted "$DEFAULT_SHA"
              TRUST_MODE=default-branch
            fi
          fi

          echo "TRUST_MODE=$TRUST_MODE"
          echo "trust_mode=$TRUST_MODE" >> "$GITHUB_OUTPUT"
          echo "SAI_TRUST_MODE=$TRUST_MODE" >> "$GITHUB_ENV"
          echo "SAI_TRUSTED_TREE=$TRUSTED" >> "$GITHUB_ENV"
          echo "SAI_CANDIDATE_TREE=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "SAI_REVIEW_NO_TRACKED_WRITE=1" >> "$GITHUB_ENV"

          if [ "$TRUST_MODE" = "unavailable" ]; then
            python3 -c 'from pathlib import Path; p=Path("/tmp/saul"); p.mkdir(parents=True, exist_ok=True); p.joinpath("review.yaml").write_text("reviewer: saul\nruntime: github-actions\ndisposition: BLOCKED\nreason: TRUSTED_REVIEWER_UNAVAILABLE\nsynthetic: false\ncodex_invoked: false\nfindings: []\ntrust_mode: unavailable\n"); p.joinpath("disposition").write_text("BLOCKED"); p.joinpath("reason").write_text("TRUSTED_REVIEWER_UNAVAILABLE"); p.joinpath("codex_invoked").write_text("false")'
            echo "BLOCKED TRUSTED_REVIEWER_UNAVAILABLE — skipping Codex"
            exit 0
          fi
          chmod +x "$TRUSTED/scripts/invoke-saul-review" \
                   "$TRUSTED/scripts/sai-dispatch-transition" 2>/dev/null || true

      - name: Ensure PyYAML
        if: steps.trust.outputs.trust_mode != 'unavailable'
        run: |
          if python3 -c 'import yaml' 2>/dev/null; then
            python3 -c 'import yaml; print("pyyaml=present", getattr(yaml, "__version__", ""))'
            exit 0
          fi
          EXPECTED=d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
          WORKDIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/saul-pyyaml.XXXXXX")
          curl -sS -L -o "$WORKDIR/pyyaml.tgz" \
            "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
          echo "$EXPECTED  $WORKDIR/pyyaml.tgz" | sha256sum -c
          tar -xzf "$WORKDIR/pyyaml.tgz" -C "$WORKDIR"
          mkdir -p "$WORKDIR/lib"
          cp -a "$WORKDIR"/pyyaml-6.0.3/lib/yaml "$WORKDIR/lib/yaml"
          echo "PYTHONPATH=$WORKDIR/lib${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          PYTHONPATH="$WORKDIR/lib${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -c 'import yaml; print("pyyaml=sdist", yaml.__version__)'

      - name: Invoke Codex as Saul
        id: saul
        if: steps.trust.outputs.trust_mode != 'unavailable'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SAI_SAUL_PACKAGE_DIR: ${{ github.workspace }}/.saul-review-package
          SAI_SAUL_REVIEW_SCOPE: final
          SAI_TRUSTED_TREE: ${{ github.workspace }}/trusted-reviewer
          SAI_CANDIDATE_TREE: ${{ github.workspace }}
          SAI_REVIEW_NO_TRACKED_WRITE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          chmod +x "$SAI_TRUSTED_TREE/scripts/invoke-saul-review"
          [ -z "${OPENAI_API_KEY:-}" ] && unset OPENAI_API_KEY
          [ -z "${CODEX_API_KEY:-}" ] && unset CODEX_API_KEY
          HEAD_SHA="${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}"
          TYPE="${{ github.event.inputs.review_type || 'implementation' }}"
          CID="${{ github.event.inputs.contract_id }}"
          REV="${{ github.event.inputs.revision }}"
          FORCE=""
          [ "${{ github.event.inputs.force }}" = "true" ] && FORCE="--force"
          DETECT=$(python3 "$SAI_TRUSTED_TREE/scripts/lib/sai_auth_review.py" invoke --detect-contract || true)
          [ -n "$CID" ] || CID="$DETECT"
          mkdir -p /tmp/saul
          set +e
          "$SAI_TRUSTED_TREE/scripts/invoke-saul-review" \
            ${CID:+--contract-id "$CID"} \
            ${REV:+--revision "$REV"} \
            --head "$HEAD_SHA" \
            --review-type "$TYPE" \
            --github-run-id "${{ github.run_id }}" \
            --github-event "${{ github.event_name }}" \
            --out /tmp/saul/review.yaml \
            $FORCE
          rc=$?
          set -e
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          python3 -c 'from pathlib import Path; p=Path("/tmp/saul"); yp=p/"review.yaml"; yp.parent.mkdir(parents=True, exist_ok=True); yp.write_text("reviewer: saul\ndisposition: BLOCKED\nreason: NO_ARTIFACT\ncodex_invoked: false\nsynthetic: false\nfindings: []\n") if not yp.is_file() else None; lines=yp.read_text(encoding="utf-8").splitlines(); disp=next((ln.split(":",1)[1].strip() for ln in lines if ln.startswith("disposition:")), "BLOCKED"); reason=next((ln.split(":",1)[1].strip() for ln in lines if ln.startswith("reason:")), "NO_ARTIFACT"); invoked=next((ln.split(":",1)[1].strip() for ln in lines if ln.startswith("codex_invoked:")), "false"); (p/"disposition").write_text(disp); (p/"reason").write_text(reason); (p/"codex_invoked").write_text(invoked)'
          exit 0

      - name: Claim remediation transition
        if: always()
        env:
          SAI_TRUSTED_TREE: ${{ github.workspace }}/trusted-reviewer
          SAI_CANDIDATE_TREE: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/saul/review.yaml ]; then
            echo "NOOP no review artifact"
            exit 0
          fi
          if [ -x "$SAI_TRUSTED_TREE/scripts/sai-dispatch-transition" ]; then
            chmod +x "$SAI_TRUSTED_TREE/scripts/sai-dispatch-transition"
            "$SAI_TRUSTED_TREE/scripts/sai-dispatch-transition" \
              --from-file /tmp/saul/review.yaml \
              --eval-only \
              --pr "${{ github.event.pull_request.number }}" \
              || echo "dispatch non-fatal"
          else
            echo "NOOP trusted dispatcher not in this trusted tree yet"
          fi

      - name: Upload Saul review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saul-review-${{ github.run_id }}
          path: |
            /tmp/saul/review.yaml
            ${{ github.workspace }}/.saul-review-package
          if-no-files-found: warn

      - name: Post review comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/saul/review.yaml ]; then
            {
              echo "### Saul CTO review (Codex)"
              echo
              echo "run: ${{ github.run_id }}"
              echo "head: \`${{ github.event.pull_request.head.sha }}\`"
              echo "runner: \`${{ runner.name }}\`"
              echo
              echo '```yaml'
              cat /tmp/saul/review.yaml
              echo '```'
            } > /tmp/saul/comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/saul/comment.md || true
          fi

      - name: Commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS_REPO: ${{ github.repository }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/saul/disposition ]; then
            printf '%s' "BLOCKED" > /tmp/saul/disposition
            printf '%s' "NO_ARTIFACT" > /tmp/saul/reason
          fi
          python3 -c 'from pathlib import Path; disp=Path("/tmp/saul/disposition").read_text(encoding="utf-8"); reason=Path("/tmp/saul/reason").read_text(encoding="utf-8"); desc=("Saul %s %s" % (disp, reason))[:140]; Path("/tmp/saul/status_desc").write_text(desc, encoding="utf-8"); Path("/tmp/saul/status_state").write_text("success" if disp.strip()=="APPROVE" else "failure", encoding="utf-8")'
          STATE=$(cat /tmp/saul/status_state)
          DESC=$(cat /tmp/saul/status_desc)
          DESC="${DESC:0:140}"
          DISP=$(cat /tmp/saul/disposition)
          gh api "repos/${STATUS_REPO}/statuses/${STATUS_SHA}" -f state="$STATE" \
            -f context="saul-cto-review" \
            -f description="$DESC" \
            -f target_url="$STATUS_URL" || true
          if [ "$DISP" = "APPROVE" ]; then
            exit 0
          fi
          printf 'Saul disposition %s is not APPROVE — CTO gate BLOCKED\n' "$DISP"
          exit 1
