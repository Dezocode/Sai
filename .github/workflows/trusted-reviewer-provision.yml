name: trusted-reviewer-provision

# Copy invoke-saul-review from an independently trusted SHA onto the
# Hostinger runner image. Never runs on pull_request (candidate YAML/data).
on:
  push:
    branches: [main]
    paths:
      - "scripts/invoke-saul-review"
      - "scripts/lib/sai_auth*.py"
      - "scripts/provision-trusted-reviewer-root"
      - ".github/workflows/trusted-reviewer-provision.yml"
  workflow_dispatch:
    inputs:
      from_sha:
        description: Explicit trusted SHA (never HEAD)
        required: true
      confirm_trust:
        description: Human confirms this SHA may become the runner image
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.from_sha || github.sha }}

      - name: Provision trusted reviewer root
        run: |
          set -euo pipefail
          chmod +x scripts/provision-trusted-reviewer-root
          SHA="${{ github.event.inputs.from_sha || github.sha }}"
          DEST="${SAI_TRUSTED_REVIEWER_ROOT:-}"
          if [ -z "$DEST" ]; then
            if mkdir -p /opt/sai/trusted-reviewer 2>/dev/null; then
              DEST=/opt/sai/trusted-reviewer
            else
              DEST="${HOME}/sai/trusted-reviewer"
              mkdir -p "$DEST"
            fi
          else
            mkdir -p "$DEST"
          fi
          CONFIRM=""
          if [ "${{ github.event_name }}" = "push" ]; then
            CONFIRM="--confirm-trust"
          elif [ "${{ github.event.inputs.confirm_trust }}" = "true" ]; then
            CONFIRM="--confirm-trust"
          fi
          scripts/provision-trusted-reviewer-root \
            --from-sha "$SHA" \
            --dest "$DEST" \
            --actor "${GITHUB_ACTOR}" \
            $CONFIRM
          test -x "$DEST/scripts/invoke-saul-review"
