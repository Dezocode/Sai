name: Sai Design Language

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "design/**"
      - "cmd/sai-design-check/**"
      - ".github/workflows/sai-design-language.yml"
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "design/**"
      - "cmd/sai-design-check/**"
      - ".github/workflows/sai-design-language.yml"

permissions:
  contents: read

jobs:
  compliance:
    name: Sai Design Language
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Verify Sai design contract and Swift source policy
        run: |
          go test ./cmd/sai-design-check/...
          go run ./cmd/sai-design-check
      - name: Compile SaiKit and native application shells
        run: |
          swift build --package-path apps/apple/Packages/SaiKit
          swift build --package-path apps/apple
          swift build --package-path apps/apple --product SaiIOS --build-path /tmp/sai-ios -Xswiftc -sdk -Xswiftc "$(xcrun --sdk iphonesimulator --show-sdk-path)" -Xswiftc -target -Xswiftc arm64-apple-ios17.0-simulator
