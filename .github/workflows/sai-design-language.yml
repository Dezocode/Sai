name: Sai Design Language

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "design/**"
      - "cmd/sai-design-check/**"
      - "cmd/sai/**"
      - "internal/**"
      - "go.mod"
      - "prototypes/**"
      - ".github/workflows/sai-design-language.yml"
  push:
    branches: [main]
    paths:
      - "apps/apple/**"
      - "design/**"
      - "cmd/sai-design-check/**"
      - "cmd/sai/**"
      - "internal/**"
      - "go.mod"
      - "prototypes/**"
      - ".github/workflows/sai-design-language.yml"

permissions:
  contents: read

jobs:
  compliance:
    name: Sai Design Language
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Verify Sai design contract and Swift source policy
        run: |
          go test ./cmd/sai-design-check/...
          go run ./cmd/sai-design-check
      - name: Compile SaiKit and native application shells
        run: |
          swift build --package-path apps/apple/Packages/SaiKit
          swift build --package-path apps/apple
          (cd apps/apple/Packages/SaiKit && xcodebuild -list && xcodebuild -scheme SaiFeatures -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sai-ios CODE_SIGNING_ALLOWED=NO)
          (cd apps/apple && xcodebuild -scheme SaiIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/sai-ios-app CODE_SIGNING_ALLOWED=NO)
