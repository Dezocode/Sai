name: Anti-regression

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Bootstrap smoke only. pull_request_target becomes authoritative after merge to main.
  push:
    branches: [ci-pr-line-budget-1200]

permissions:
  contents: read

jobs:
  anti-regression:
    name: Anti-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce capability floor
        shell: bash
        run: |
          set -euo pipefail
          python3 - trusted candidate <<'PY'
          import json
          import pathlib
          import re
          import sys

          base = pathlib.Path(sys.argv[1])
          cand = pathlib.Path(sys.argv[2])
          failures = []
          notes = []

          def fail(message):
              failures.append(message)

          def json_documents(root):
              docs = []
              for path in root.rglob("*.json"):
                  if ".git" in path.parts:
                      continue
                  try:
                      docs.append((path, json.loads(path.read_text(encoding="utf-8"))))
                  except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                      fail(f"invalid JSON in {path.relative_to(root)}: {exc}")
              return docs

          base_docs = json_documents(base)
          cand_docs = json_documents(cand)

          def discover_agents(docs):
              found = {}
              for _, doc in docs:
                  if not isinstance(doc, dict) or not isinstance(doc.get("agents"), list):
                      continue
                  for agent in doc["agents"]:
                      if isinstance(agent, dict) and agent.get("agent_id"):
                          found[agent["agent_id"]] = agent
              return found

          base_agents = discover_agents(base_docs)
          cand_agents = discover_agents(cand_docs)
          protected_agents = {
              aid: agent for aid, agent in base_agents.items()
              if agent.get("status") in {"active", "provisional"}
          }

          for aid, previous in sorted(protected_agents.items()):
              current = cand_agents.get(aid)
              if current is None:
                  fail(f"agent capability removed: {aid}")
                  continue
              if current.get("status") not in {"active", "provisional"}:
                  fail(f"agent capability disabled: {aid} status={current.get('status')!r}")
              for field in ("purpose", "principal", "primary_runtime", "automation"):
                  if not current.get(field):
                      fail(f"agent capability weakened: {aid} missing {field}")
              if not isinstance(current.get("entry_points"), dict) or not current["entry_points"]:
                  fail(f"agent capability weakened: {aid} has no entry point")

          def verified_capabilities(docs):
              caps = {}
              for _, doc in docs:
                  if not isinstance(doc, dict) or not doc.get("agent_id"):
                      continue
                  items = doc.get("capabilities")
                  if not isinstance(items, list):
                      continue
                  bucket = caps.setdefault(doc["agent_id"], set())
                  for item in items:
                      if isinstance(item, dict) and item.get("status") == "verified" and item.get("id"):
                          bucket.add(item["id"])
              return caps

          base_caps = verified_capabilities(base_docs)
          cand_caps = verified_capabilities(cand_docs)
          for aid, expected in sorted(base_caps.items()):
              missing = expected - cand_caps.get(aid, set())
              if missing:
                  fail(f"verified capabilities removed for {aid}: {', '.join(sorted(missing))}")

          def workflow_names(root):
              names = set()
              wf = root / ".github" / "workflows"
              if not wf.is_dir():
                  return names
              for path in list(wf.glob("*.yml")) + list(wf.glob("*.yaml")):
                  try:
                      for line in path.read_text(encoding="utf-8").splitlines():
                          if line.startswith("name:"):
                              names.add(line.split(":", 1)[1].strip().strip("\"'"))
                              break
                  except (OSError, UnicodeDecodeError):
                      pass
              return names

          missing_workflows = workflow_names(base) - workflow_names(cand)
          if missing_workflows:
              fail("GitHub CI capability removed: " + ", ".join(sorted(missing_workflows)))

          def gateway_contracts(docs):
              matches = []
              for path, doc in docs:
                  if not isinstance(doc, dict):
                      continue
                  gateway = doc.get("gateway")
                  ingest = doc.get("dashboard_ingest")
                  if isinstance(gateway, dict) and isinstance(ingest, dict) and (
                      "host" in gateway or "bind_policy" in gateway
                  ):
                      matches.append((path, gateway, ingest))
              return matches

          if gateway_contracts(base_docs):
              valid = False
              for _, gateway, ingest in gateway_contracts(cand_docs):
                  remote = gateway.get("remote_access") or {}
                  forbidden = remote.get("forbidden_without_documentation") or []
                  if (
                      gateway.get("host") == "127.0.0.1"
                      and gateway.get("bind_policy") == "loopback_default"
                      and ingest.get("bind") == "127.0.0.1"
                      and "0.0.0.0" in forbidden
                  ):
                      valid = True
                      break
              if not valid:
                  fail("OpenClaw gateway safety regressed: loopback-default contract no longer holds")

          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bghp_[A-Za-z0-9]{36}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{40,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
          ]

          def secret_hits(root):
              hits = set()
              for path in root.rglob("*"):
                  if not path.is_file() or ".git" in path.parts:
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except (OSError, UnicodeDecodeError):
                      continue
                  for number, line in enumerate(text.splitlines(), 1):
                      if any(pattern.search(line) for pattern in secret_patterns):
                          hits.add((str(path.relative_to(root)), number, line.strip()))
              return hits

          new_secret_hits = secret_hits(cand) - secret_hits(base)
          if new_secret_hits:
              for path, line, _ in sorted(new_secret_hits):
                  fail(f"new secret-like material detected: {path}:{line}")

          notes.append(f"protected agents: {len(protected_agents)}")
          notes.append(f"verified capability IDs: {sum(len(v) for v in base_caps.values())}")
          notes.append(f"base workflow capabilities: {len(workflow_names(base))}")

          if failures:
              print("ANTI-REGRESSION: FAIL", file=sys.stderr)
              for message in failures:
                  print(f"- {message}", file=sys.stderr)
              raise SystemExit(1)

          print("ANTI-REGRESSION: PASS")
          for note in notes:
              print(f"- {note}")
          PY

      - name: Summarize trust mode
        if: always()
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "### Anti-regression: authoritative" >> "$GITHUB_STEP_SUMMARY"
            echo "Policy came from the trusted base SHA and inspected the exact PR head without executing candidate code." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Anti-regression: bootstrap smoke" >> "$GITHUB_STEP_SUMMARY"
            echo "This branch push tests the policy before merge. It is not an authoritative PR gate until the workflow exists on main." >> "$GITHUB_STEP_SUMMARY"
          fi
