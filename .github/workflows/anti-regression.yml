name: Anti-regression

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Bootstrap smoke for PR #67 only; removed after the policy passes.
  push:
    branches: [ci-pr-line-budget-1200]

permissions:
  contents: read

jobs:
  anti-regression:
    name: Anti-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted behavioral policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            python3 trusted/.github/policy/anti-regression.py \
              --trusted trusted \
              --candidate candidate \
              --self-test
          else
            # Bootstrap only: main does not contain the policy yet, so exercise the
            # candidate copy against trusted main. This is not an authoritative PR gate.
            python3 candidate/.github/policy/anti-regression.py \
              --trusted trusted \
              --candidate candidate \
              --self-test
          fi

      - name: Summarize trust mode
        if: always()
        shell: bash
        run: |
          echo "### Anti-regression" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "Authoritative: policy executed from the exact trusted base SHA against the exact PR head." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bootstrap smoke only: candidate policy was exercised before it exists on main." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Candidate behavior runs without persisted Git credentials, write permissions, or repository secrets." >> "$GITHUB_STEP_SUMMARY"
